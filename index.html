<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcus Vigneron — Concept art & 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111111;
    --bg-alt: #191919;
    --surface: #1e1e1e;
    --surface-2: #282828;
    --ink: #f0ede6;
    --muted: #938d82;
    --accent: #d1c8b6;
    --line: rgba(209, 200, 182, 0.16);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #eeece6;
    --bg-alt: #e4e1d8;
    --surface: #faf9f5;
    --surface-2: #eeeae0;
    --ink: #1c1a16;
    --muted: #726b5c;
    --accent: #5c5344;
    --line: rgba(92, 83, 68, 0.2);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  /* Police d'affichage sans-serif pour les titres (Space Grotesk) */
  h1, h2, h3 { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }

  /* La page d'accueil tient exactement dans la hauteur de l'écran :
     seul le carrousel (.stage) défile, pas la page entière. */
  #homeView {
    height: 100vh;
    height: calc(var(--vh, 1vh) * 100);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- Intro ---------- */
  .intro { max-width: 640px; margin: 0 auto; padding: 1.6rem 1.5rem 0.8rem; text-align: center; flex-shrink: 0; }
  .intro .mark { width: 48px; height: 48px; margin: 0 auto 1rem; display: block; object-fit: contain; }
  .intro h1 {
    font-weight: 600;
    font-size: clamp(1.9rem, 7vw, 2.6rem);
    letter-spacing: -0.01em;
    margin: 0 0 0.6rem;
    line-height: 1.1;
  }
  .intro p.tagline { color: var(--muted); font-size: 1rem; line-height: 1.6; max-width: 38ch; margin: 0 auto; }
  .intro .hint {
    margin-top: 1.6rem; font-size: 0.82rem; color: var(--muted);
    display: inline-flex; align-items: center; gap: 0.5rem;
  }
  .intro .hint svg { width: 14px; height: 14px; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(4px);} }

  /* ---------- Carousel ---------- */
  /* flex: 1 1 0 (et non "auto") évite un bug classique de flexbox : avec
     "auto", ce bloc essaie de se dimensionner selon son contenu interne
     (qui utilise lui-même height:100%), ce qui crée une boucle et peut
     faire déborder le fond du carrousel par-dessus l'en-tête/le pied de
     page selon la taille d'écran. */
  .stage { position: relative; flex: 1 1 0; min-height: 0; display: flex; justify-content: center; overflow: hidden; }
  .stage::before {
    content: ""; position: absolute; inset: 0;
    width: min(92%, 480px); margin: 0 auto;
    background: var(--bg-alt); border-radius: 28px;
  }
  .carousel {
    position: relative; width: min(92%, 480px); height: 100%;
    overflow-y: auto; overflow-x: hidden;
    scroll-snap-type: y mandatory; scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    padding: calc(50% - 90px) 0; /* valeur de repli, recalculée précisément en JS juste en dessous */
    scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }

  .card { scroll-snap-align: center; display: flex; align-items: center; justify-content: center; padding: 14px 0; cursor: pointer; }
  .card-inner {
    position: relative; width: 58%; aspect-ratio: 1 / 1;
    border-radius: 18px; overflow: hidden;
    background: var(--surface); border: 2px solid transparent;
    filter: grayscale(1) brightness(0.55);
    transform: scale(0.86);
    transition: width 0.45s cubic-bezier(.22,.9,.32,1),
                transform 0.45s cubic-bezier(.22,.9,.32,1),
                filter 0.45s ease, border-color 0.3s ease, box-shadow 0.45s ease;
  }
  .card .art { position: absolute; inset: 0; }
  .card .art svg { width: 100%; height: 100%; display: block; }
  .card .art img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .card .desc {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 16px 16px;
    background: linear-gradient(180deg, rgba(10,10,10,0) 0%, rgba(10,10,10,0.92) 55%);
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.35s ease 0.1s, transform 0.35s ease 0.1s;
  }
  .desc .kind { display: block; font-size: 0.72rem; color: rgba(255,255,255,0.6); margin-bottom: 2px; }
  .desc h2 { font-weight: 600; font-size: 1.15rem; margin: 0 0 4px; color: #fff; }
  .desc p { margin: 0 0 6px; font-size: 0.83rem; line-height: 1.4; color: rgba(255,255,255,0.78); }
  .desc .cta { font-size: 0.78rem; color: var(--accent); font-weight: 600; }

  .card.active .card-inner {
    width: 100%; transform: scale(1); filter: grayscale(0) brightness(1);
    border-color: var(--accent); box-shadow: 0 18px 40px -12px rgba(0,0,0,0.6);
  }
  .card.active .desc { opacity: 1; transform: translateY(0); }
  .card:not(.active) .card-inner:hover { filter: grayscale(0.7) brightness(0.7); }
  .card-inner:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .spacer { scroll-snap-align: none; }

  .progress { display: flex; justify-content: center; gap: 6px; margin-top: 10px; flex-shrink: 0; }
  .progress span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--muted); opacity: 0.4;
    transition: opacity 0.3s ease, transform 0.3s ease, background 0.3s ease;
  }
  .progress span.active { opacity: 1; background: var(--accent); transform: scale(1.5); }

  /* ---------- Footer ---------- */
  footer { max-width: 640px; margin: 0.6rem auto 0; padding: 0.7rem 1.5rem 0.8rem; text-align: center; border-top: 1px solid var(--line); flex-shrink: 0; }
  footer p { color: var(--muted); font-size: 0.78rem; margin: 0 0 0.6rem; }
  footer .links { display: flex; justify-content: center; gap: 1.4rem; font-size: 0.88rem; font-weight: 500; }
  footer .links a { text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }

  /* ---------- Project detail view ---------- */
  #projectView { display: none; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  #projectView.visible { display: block; }
  #homeView.hidden { display: none; }

  .project-header { max-width: 720px; margin: 0 auto; padding: 1.4rem 1.5rem 0; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; color: var(--muted);
    font: inherit; font-size: 0.88rem; cursor: pointer; padding: 8px 0;
  }
  .back-btn svg { width: 16px; height: 16px; }
  .back-btn:hover { color: var(--ink); }

  .project-hero { max-width: 720px; margin: 1rem auto 0; padding: 0 1.5rem; }
  .project-hero .frame {
    width: 100%; aspect-ratio: 4 / 3; border-radius: 20px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line);
    margin: 0 auto;
  }
  .project-hero .frame.vertical { aspect-ratio: 9 / 16; max-width: 360px; }
  .project-hero .frame.auto-height {
    aspect-ratio: unset; height: auto; max-width: 540px;
    background: transparent; border: none; display: flex; justify-content: center;
    overflow: visible; border-radius: 0;
  }
  .project-hero .frame svg { width: 100%; height: 100%; display: block; }
  .project-hero .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .project-hero .frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .project-hero .frame iframe { width: 100%; height: 100%; display: block; border: 0; }

  .project-body { max-width: 720px; margin: 0 auto; padding: 1.8rem 1.5rem 1rem; }
  .project-body .kind { display: inline-block; font-size: 0.78rem; color: var(--accent); margin-bottom: 0.5rem; }
  .project-body h1 { font-weight: 600; font-size: clamp(1.6rem, 6vw, 2.1rem); margin: 0 0 1rem; line-height: 1.15; }
  .project-body p { color: var(--muted); line-height: 1.7; font-size: 0.98rem; max-width: 62ch; margin: 0 0 1rem; }

  .gallery { max-width: 720px; margin: 1rem auto 0; padding: 0 1.5rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .gallery .tile {
    aspect-ratio: 1 / 1; border-radius: 14px; background: var(--surface);
    border: 1px dashed var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    color: var(--muted); font-size: 0.78rem; text-align: center; padding: 0.6rem;
    overflow: hidden;
  }
  .gallery .tile svg { width: 22px; height: 22px; opacity: 0.6; }
  .gallery .tile.filled { border-style: solid; padding: 0; cursor: zoom-in; }
  .gallery .tile.filled img { width: 100%; height: 100%; object-fit: cover; }

  /* ---------- Visionneuse plein écran (galerie) ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(6, 6, 6, 0.94);
    display: none; align-items: center; justify-content: center;
    padding: calc(1.2rem + env(safe-area-inset-top, 0px)) 1.2rem calc(1.2rem + env(safe-area-inset-bottom, 0px));
    cursor: zoom-out;
  }
  .lightbox.visible { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; object-fit: contain; cursor: default; }
  .lightbox .lightbox-close {
    position: absolute; top: calc(1rem + env(safe-area-inset-top, 0px)); right: 1rem;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 1px solid var(--line);
    color: var(--ink); display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .lightbox .lightbox-close svg { width: 18px; height: 18px; }

  .project-nav {
    max-width: 720px; margin: 2rem auto 0; padding: 1.4rem 1.5rem 3rem;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;
  }
  .project-nav a { text-decoration: none; color: var(--ink); font-weight: 500; }
  .project-nav a:hover { color: var(--accent); }

  @media (min-width: 700px) {
    .gallery { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-height: 700px) {
    .intro { padding: 0.9rem 1.5rem 0.5rem; }
    .intro .mark { width: 36px; height: 36px; margin-bottom: 0.6rem; }
    .intro h1 { font-size: clamp(1.4rem, 6vw, 1.9rem); margin-bottom: 0.4rem; }
    .intro p.tagline { font-size: 0.88rem; }
    .intro .hint { margin-top: 0.8rem; }
    footer { padding: 0.5rem 1.5rem 0.6rem; }
    footer p { margin-bottom: 0.4rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .carousel { scroll-behavior: auto; }
    .card-inner, .desc, .intro .hint svg, .progress span { transition: none; animation: none; }
  }
</style>
</head>
<body>

<div id="homeView">
  <header class="intro">
    <img class="mark" src="Images/Logosite.png" alt="Logo Marcus Vigneron">
    <h1>Marcus Vigneron</h1>
    <p class="tagline">Passionné par la création d'univers, j'aime concrétiser des idées et leur donner vie — concept art, illustration, modélisation et animation 3D.</p>
    <span class="hint">
      Fais défiler pour explorer
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16M6 14l6 6 6-6"/></svg>
    </span>
  </header>

  <main class="stage">
    <div class="carousel" id="carousel">
      <div class="spacer" style="height:1px"></div>
      <!-- Les cartes sont générées automatiquement par le JS à partir du tableau "projects" plus bas -->
      <div class="spacer" style="height:1px"></div>
    </div>
  </main>

  <div class="progress" id="progress"></div>

  <footer>
    <p>Disponible pour des projets de concept art, modélisation et animation 3D.</p>
    <div class="links">
      <a href="https://www.instagram.com/vigneronmarcus/" target="_blank" rel="noopener">Instagram</a>
      <a href="mailto:superdypasse@gmail.com">Email</a>
    </div>
  </footer>
</div>

<div id="projectView">
  <div class="project-header">
    <button class="back-btn" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Retour au portfolio
    </button>
  </div>
  <div class="project-hero"><div class="frame" id="projectHero"></div></div>
  <div class="project-body" id="projectBody"></div>
  <div class="gallery" id="projectGallery"></div>
  <div class="project-nav" id="projectNav"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Fermer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
(function() {

  // ---------------------------------------------------------------
  // Hauteur d'écran fiable sur mobile : la barre d'adresse du
  // navigateur (Safari/Chrome mobile) apparaît/disparaît en cours de
  // scroll, ce qui fausse 100vh (et parfois 100dvh sur certains
  // navigateurs). On calcule donc la vraie hauteur visible en JS et on
  // la stocke dans --vh, utilisée comme repli dans la CSS ci-dessus.
  // ---------------------------------------------------------------
  function setRealVH() {
    var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
    document.documentElement.style.setProperty('--vh', h + 'px');
  }
  setRealVH();
  window.addEventListener('resize', setRealVH);
  window.addEventListener('orientationchange', setRealVH);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setRealVH);
    window.visualViewport.addEventListener('scroll', setRealVH);
  }

  // ---------------------------------------------------------------
  // Espacement haut/bas du carrousel : il doit exactement valoir la
  // moitié de la hauteur d'une carte "active" pour que la première et
  // la dernière carte puissent se centrer correctement au scroll-snap.
  // Une valeur fixe en CSS (approximation basée sur la largeur) se
  // dérègle si la largeur change beaucoup — on la recalcule donc en JS
  // à partir des dimensions réellement mesurées.
  // ---------------------------------------------------------------
  function updateCarouselPadding() {
    var stageEl = document.querySelector('.stage');
    var carouselEl = document.getElementById('carousel');
    if (!stageEl || !carouselEl) return;
    var stageHeight = stageEl.clientHeight;
    var activeCardHeight = carouselEl.clientWidth; // carte active = carré (aspect-ratio 1/1) de la largeur du carrousel
    var pad = Math.max(0, (stageHeight - activeCardHeight) / 2);
    carouselEl.style.paddingTop = pad + 'px';
    carouselEl.style.paddingBottom = pad + 'px';
  }

  // =====================================================================
  //  TES PROJETS — modifie uniquement ce tableau pour tout mettre à jour
  //  (le carrousel ET les pages projet sont générés automatiquement à
  //  partir de ces données, tu n'as rien d'autre à toucher).
  // =====================================================================
  //
  //  Pour chaque projet :
  //    id     -> identifiant unique sans espace/accent (sert dans l'URL)
  //    kind   -> le type de projet ("Concept art", "Illustration",
  //              "Modélisation 3D", "Animation 3D"...)
  //    title  -> le titre du projet
  //    short  -> texte affiché SUR LA CARTE du carrousel (1-2 phrases)
  //    long   -> tableau de paragraphes affichés SUR LA PAGE du projet
  //              (autant de paragraphes que tu veux : "p1", "p2", ...)
  //
  //  >>> IMAGES <<<
  //    image   -> chemin/URL de TON image principale (carte + grande
  //               image en haut de la page projet). Exemple :
  //               image: 'images/citadelle.jpg'
  //               Laisse '' (vide) pour garder le placeholder gris.
  //    gallery -> liste de 1 à 4 images supplémentaires affichées en bas
  //               de la page projet (croquis, autres vues, étapes...).
  //               Exemple :
  //               gallery: ['images/citadelle-2.jpg', 'images/citadelle-3.jpg']
  //               Laisse [] (vide) pour garder les cases "à remplir".
  //
  //  >>> VIDÉO (uniquement sur la page du projet, pas sur la carte) <<<
  //    video   -> chemin vers un fichier vidéo LOCAL (.mp4) que tu as
  //               mis dans ton dossier, ex: 'images/citadelle-render.mp4'
  //               Elle remplace l'image en haut de la page, en boucle
  //               silencieuse avec contrôles. Prioritaire sur "youtube".
  //    youtube -> identifiant d'une vidéo YouTube. Pour une vidéo classique,
  //               c'est le code après "v=" dans l'URL, ex:
  //               'https://www.youtube.com/watch?v=dQw4w9WgXcQ' -> 'dQw4w9WgXcQ'
  //               Pour un SHORT, c'est le code après "/shorts/", ex:
  //               'https://www.youtube.com/shorts/aBc123XyZ9' -> 'aBc123XyZ9'
  //               (même champ "youtube" pour les deux, utilisée seulement
  //               si "video" est vide).
  //    vertical -> mets "true" si la vidéo (locale ou YouTube) est au
  //               format vertical (cas d'un Short, ou d'un clip filmé au
  //               téléphone) : le cadre s'adapte pour éviter les grosses
  //               bandes noires. Laisse "false" pour une vidéo classique
  //               au format paysage.
  //    Laisse "video" et "youtube" vides ('') pour ne pas afficher de
  //    vidéo : c'est alors "image" (ou le placeholder) qui s'affiche.
  //
  //  >>> INSTAGRAM (post ou reel, uniquement sur la page du projet) <<<
  //    instagram -> colle simplement le lien complet de ton post ou reel
  //               Instagram, ex:
  //               instagram: 'https://www.instagram.com/reel/Cxxxxxxxxxx/'
  //               ou 'https://www.instagram.com/p/Cxxxxxxxxxx/'
  //               Utilisé seulement si "video" et "youtube" sont vides.
  //               Contrairement à YouTube, Instagram calcule lui-même sa
  //               taille (via son propre script officiel), donc le champ
  //               "vertical" n'a pas d'effet ici — inutile de le changer.
  //
  //  Si tu ouvres ce fichier en local (VS Code / double-clic), un chemin
  //  relatif du type 'images/mon-fichier.jpg' fonctionne très bien tant
  //  que le dossier "images" est à côté de ce fichier html.
  // =====================================================================
  var projects = [
    {
      id: 'universgraphique',
      kind: 'Galerie d\'illustrations',
      title: 'Mon Univers Graphique',
      short: "Rapide exposition de mon univers graphique, à travers quelques illustrations et concepts.",
      long: [
        "Ces illustrations sont des concepts que j'ai réalisés pour des projets personnels ou des exercices de style. Elles reflètent mon intérêt pour la création d'univers immersifs et la narration visuelle.",
      ],
      image: 'Images/Paysage-pylone.webp',
      video: '',      // <-- OU un fichier vidéo local (.mp4), ex: 'images/mon-clip.mp4'
      youtube: '',    // <-- OU un ID de vidéo YouTube (voir explication plus haut)
      vertical: false, // <-- mets "true" si c'est un Short / vidéo verticale
      instagram: 'https://www.instagram.com/p/DZPXxK8PrVL/', // <-- OU un lien de post/reel Instagram
      gallery: ['Images/Illu-marcuspourcourtmetrage.webp','Images/karganrefont.webp','Images/Rendudessinsurf09082025.webp','Images/Paysage-pylone.webp','Images/guivrefinalverV2.webp','Images/contest_farm_for_likram_Marcus_Vigneron.webp','Images/maitre_cavalier_dragon_kargan.webp'],
      artColor: '#242424'
    },
    {
      id: 'zuzudune',
      kind: 'Pwnisher 3D Challenge - Gauntlet of Gods - Août 2026',
      title: 'La Gerboise Zuzu - In Top 100',
      short: "Le thème de ce challenge était de faire une présentation de personnage pour un jeu de carte.",
      long: [
        "On avait un temps limité pour faire ce projet, c'était donc un défi à réaliser comme toujours, c'est appréciable de pouvoir exprimer et animer ses idées.",
        "Il était nécessaire de faire une illustration de personnage, pour la colorimétrie globale de la réalisation afin d'avoir une bonne base.",
        "Ici pour l'idée de la gerboise c'est un petit personnage rapide et agile bourré d'équipements face à un immense golem représenté de manière simple pour représenter sa force brute, ça rappellera le fameux David contre Goliath.",
      ],
      image: 'Images/carteillu.webp',      // <-- METS ICI le chemin de TON image principale
      video: '',      // <-- OU un fichier vidéo local (.mp4), ex: 'images/mon-clip.mp4'
      youtube: '4_Jxu1KHtaU',    // <-- OU un ID de vidéo YouTube (voir explication plus haut)
      vertical: true, // <-- mets "true" si c'est un Short / vidéo verticale
      instagram: '', // <-- OU un lien de post/reel Instagram
      gallery: ['Images/Capture-d_écran-2026-05-09-145643.webp','Images/illu-marcuspourcourtmetrage.webp','Images/carteillu.webp'],    // <-- METS ICI 1 à 4 images supplémentaires
      artColor: '#2a2a2a'
    },
    {
      id: 'cartes-customisees',
      kind: 'Illustration de cartes - Mai 2026',
      title: 'Cartes Customisées',
      short: "Impression de cartes customisées pour du fanmade Magic the Gathering.",
      long: [
      ],
      image: 'Images/karganrefont.webp',
      video: '',      // <-- OU un fichier vidéo local (.mp4), ex: 'images/mon-clip.mp4'
      youtube: '',    // <-- OU un ID de vidéo YouTube (voir explication plus haut)
      vertical: false, // <-- mets "true" si c'est un Short / vidéo verticale
      instagram: '', // <-- OU un lien de post/reel Instagram
      gallery: ['Images/framekargannrgb.webp','Images/GUI1.webp','Images/GUI2.webp','Images/GUI3.webp','Images/GUI4.webp','Images/photocarte.webp'],
      artColor: '#282828'
    },
    {
      id: 'plantpulsegraffiti',
      kind: 'Pwnisher 3D Challenge - Dream Sequence - Février 2026',
      title: 'Plant Pulse Graffiti - In Top 100',
      short: "Le thème de ce challenge était de faire une animation thématisée en rythme à 120BPM.",
      long: [

        "Jeu de couleur avec les fleurs et les feuilles. J'ai voulu contraster avec le fait qu'en ville on bétonne tout et qu'on oublie la nature, mais que la nature reprend toujours ses droits.",
        "le représenter avec un artiste plante était une harmonie qui me parlait.",
      ],
      image: 'Images/ppplantgrafff.webp',
      video: '',      // <-- OU un fichier vidéo local (.mp4), ex: 'images/mon-clip.mp4'
      youtube: 'DIW0_aqXYwQ',    // <-- OU un ID de vidéo YouTube (voir explication plus haut)
      vertical: false, // <-- mets "true" si c'est un Short / vidéo verticale
      instagram: '', // <-- OU un lien de post/reel Instagram
      gallery: ['Images/ppgto3D.webp','Images/ppgdesign1.webp','Images/ppgcroquis.webp'],
      artColor: '#1f1f1f'
    },
    {
      id: 'wavesandfangs',
      kind: 'Pwnisher 3D Challenge - Rampage Rally - Août 2025',
      title: 'Waves and Fangs - In Top 100',
      short: "Le thème était de faire un véhicule sautant par-delà une rampe (avec différentes interprétations de ce qu'est une rampe disponible).",
      long: [
        "Dans l'idée de styliser un maximum mon animation afin de faire transporter dans l'imaginaire et l'envie de s'y plonger avec toutes ces couleurs saturées.",
        "Je me suis inspiré de là où je vis, la mer et les vagues, j'ai donc voulu faire un véhicule qui se propulse dans les vagues avec un style de dessin animé.",
        "Il m'arrive de temps en temps de faire du skimboard. Je m'en suis inspiré ici"
      ],
      image: 'Images/Capture décran skimboard.webp',
      video: '',      // <-- OU un fichier vidéo local (.mp4), ex: 'images/mon-clip.mp4'
      youtube: 'mGHgWeDlc6I',    // <-- OU un ID de vidéo YouTube (voir explication plus haut)
      vertical: false, // <-- mets "true" si c'est un Short / vidéo verticale
      instagram: '', // <-- OU un lien de post/reel Instagram
      gallery: ['Images/Capture décran skimboard.webp','Images/Rendudessinsurf09082025.webp','Images/boardguy.webp'],
      artColor: '#232323'
    },
    {
      id: 'coeur-de-cristal',
      kind: 'Animation 3D',
      title: 'Cœur de Cristal',
      short: "Relique magique modélisée et animée en boucle pour une vitrine interactive.",
      long: [
        "Objet modélisé puis animé en boucle continue, destiné à être présenté dans une vitrine interactive au sein d'un jeu ou d'une installation.",
        "Le défi principal était de créer une animation de lumière interne crédible, sans casser la lisibilité de la forme du cristal."
      ],
      image: '',
      video: '',      // <-- OU un fichier vidéo local (.mp4), ex: 'images/mon-clip.mp4'
      youtube: '',    // <-- OU un ID de vidéo YouTube (voir explication plus haut)
      vertical: false, // <-- mets "true" si c'est un Short / vidéo verticale
      instagram: '', // <-- OU un lien de post/reel Instagram
      gallery: [],
      artColor: '#262626'
    }
  ];

  // ---------------------------------------------------------------
  // Placeholder SVG neutre — utilisé uniquement tant que "image" est vide.
  // ---------------------------------------------------------------
  function artSVG(color) {
    return '<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice">' +
      '<rect width="200" height="200" fill="' + color + '"/>' +
      '<circle cx="100" cy="86" r="30" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity="0.55"/>' +
      '<path d="M60 150c14-30 66-30 80 0" stroke="var(--accent)" stroke-width="1.2" fill="none" opacity="0.4"/>' +
      '</svg>';
  }

  function galleryIconSVG() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">' +
      '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/>' +
      '<path d="M21 16l-5-5-4 4-3-3-6 6"/></svg>';
  }

  // Retourne le HTML d'une image de projet : la vraie image si "image"
  // est renseigné, sinon le placeholder gris. Utilisé pour les cartes
  // du carrousel (pas de vidéo ici, pour rester léger sur mobile).
  function mediaHTML(p) {
    if (p.image) {
      return '<img src="' + p.image + '" alt="' + p.title + '">';
    }
    return artSVG(p.artColor);
  }

  // ---------------------------------------------------------------
  // Instagram : on utilise le script officiel d'Instagram (embed.js),
  // qui calcule lui-même la bonne taille du post/reel — contrairement
  // à un simple <iframe>, qui ne s'adapte pas correctement.
  // ---------------------------------------------------------------
  var instagramScriptRequested = false;

  function ensureInstagramScript(callback) {
    if (window.instgrm && window.instgrm.Embeds) { callback(); return; }
    if (!instagramScriptRequested) {
      instagramScriptRequested = true;
      var script = document.createElement('script');
      script.src = 'https://www.instagram.com/embed.js';
      script.async = true;
      document.body.appendChild(script);
    }
    var tries = 0;
    var wait = setInterval(function() {
      tries++;
      if (window.instgrm && window.instgrm.Embeds) {
        clearInterval(wait);
        callback();
      } else if (tries > 100) {
        clearInterval(wait); // abandon après ~10s (ex: pas de connexion internet)
      }
    }, 100);
  }

  function instagramBlockquoteHTML(url) {
    return '<blockquote class="instagram-media" data-instgrm-captioned ' +
      'data-instgrm-permalink="' + url + '" data-instgrm-version="14" ' +
      'style="background:#111;border:0;border-radius:12px;margin:0;max-width:540px;' +
      'min-width:280px;width:100%;"></blockquote>';
  }

  // Retourne le HTML pour la grande zone en haut de la page projet.
  // Ordre de priorité : vidéo locale > vidéo YouTube > post/reel Instagram > image > placeholder.
  function heroMediaHTML(p) {
    if (p.video) {
      return '<video src="' + p.video + '" autoplay muted loop playsinline controls></video>';
    }
    if (p.youtube) {
      return '<iframe src="https://www.youtube.com/embed/' + p.youtube +
        '" title="' + p.title + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    }
    if (p.instagram) {
      return instagramBlockquoteHTML(p.instagram);
    }
    return mediaHTML(p);
  }

  // ---------------------------------------------------------------
  // Rendu des cartes du carrousel
  // ---------------------------------------------------------------
  var carousel = document.getElementById('carousel');
  var spacers = carousel.querySelectorAll('.spacer');

  projects.forEach(function(p) {
    var card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = p.id;
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-pressed', 'false');
    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="art">' + mediaHTML(p) + '</div>' +
        '<div class="desc">' +
          '<span class="kind">' + p.kind + '</span>' +
          '<h2>' + p.title + '</h2>' +
          '<p>' + p.short + '</p>' +
          '<span class="cta">Reclique pour voir le projet →</span>' +
        '</div>' +
      '</div>';
    carousel.insertBefore(card, spacers[1]);
  });

  updateCarouselPadding();

  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var progress = document.getElementById('progress');
  cards.forEach(function() { progress.appendChild(document.createElement('span')); });
  var dots = Array.prototype.slice.call(progress.children);

  var activeIndex = -1;
  function setActive(index) {
    if (index === activeIndex) return;
    activeIndex = index;
    cards.forEach(function(card, i) {
      var isActive = i === index;
      card.classList.toggle('active', isActive);
      card.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
    dots.forEach(function(dot, i) { dot.classList.toggle('active', i === index); });
  }

  function nearestIndex() {
    var stageRect = carousel.getBoundingClientRect();
    var center = stageRect.top + stageRect.height / 2;
    var best = 0, bestDist = Infinity;
    cards.forEach(function(card, i) {
      var r = card.getBoundingClientRect();
      var dist = Math.abs((r.top + r.height / 2) - center);
      if (dist < bestDist) { bestDist = dist; best = i; }
    });
    return best;
  }

  var scrollTimer = null;
  carousel.addEventListener('scroll', function() {
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function() { setActive(nearestIndex()); }, 80);
  }, { passive: true });

  function handleSelect(index, card) {
    if (index === activeIndex) {
      navigateTo(card.dataset.id);
    } else {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setActive(index);
    }
  }

  cards.forEach(function(card, i) {
    card.addEventListener('click', function() { handleSelect(i, card); });
    card.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleSelect(i, card); }
    });
  });

  // ---------------------------------------------------------------
  // Routage : page projet intégrée au site (pas de lien externe)
  // ---------------------------------------------------------------
  var homeView = document.getElementById('homeView');
  var projectView = document.getElementById('projectView');
  var projectHero = document.getElementById('projectHero');
  var projectBody = document.getElementById('projectBody');
  var projectGallery = document.getElementById('projectGallery');
  var projectNav = document.getElementById('projectNav');
  var backBtn = document.getElementById('backBtn');

  // ---------------------------------------------------------------
  // Visionneuse plein écran pour les images de la galerie
  // ---------------------------------------------------------------
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var lightboxClose = document.getElementById('lightboxClose');

  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.classList.add('visible');
  }
  function closeLightbox() {
    lightbox.classList.remove('visible');
    lightboxImg.src = '';
  }
  lightbox.addEventListener('click', function(e) {
    if (e.target === lightbox) closeLightbox();
  });
  lightboxClose.addEventListener('click', closeLightbox);
  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && lightbox.classList.contains('visible')) closeLightbox();
  });

  function renderProject(p) {
    // Grande image (ou vidéo / embed) en haut de la page projet
    projectHero.innerHTML = heroMediaHTML(p);
    projectHero.classList.toggle('vertical', !!p.vertical && !p.instagram);
    projectHero.classList.toggle('auto-height', !p.video && !p.youtube && !!p.instagram);

    // Si c'est un post/reel Instagram, on demande au script officiel
    // de le transformer en embed correctement dimensionné.
    if (!p.video && !p.youtube && p.instagram) {
      ensureInstagramScript(function() {
        requestAnimationFrame(function() { window.instgrm.Embeds.process(); });
      });
    }

    // Titre + description (textes "kind" et "long" du tableau projects)
    projectBody.innerHTML =
      '<span class="kind">' + p.kind + '</span>' +
      '<h1>' + p.title + '</h1>' +
      p.long.map(function(par) { return '<p>' + par + '</p>'; }).join('');

    // Galerie du bas : images réelles si "gallery" est rempli,
    // sinon 3 cases "à remplir" en placeholder.
    projectGallery.innerHTML = '';
    if (p.gallery && p.gallery.length) {
      p.gallery.forEach(function(src, i) {
        var tile = document.createElement('div');
        tile.className = 'tile filled';
        tile.tabIndex = 0;
        tile.setAttribute('role', 'button');
        tile.setAttribute('aria-label', p.title + ' - vue ' + (i + 1) + ', agrandir');
        tile.innerHTML = '<img src="' + src + '" alt="' + p.title + ' - vue ' + (i + 1) + '">';
        tile.addEventListener('click', function() { openLightbox(src, p.title + ' - vue ' + (i + 1)); });
        tile.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(src, p.title + ' - vue ' + (i + 1)); }
        });
        projectGallery.appendChild(tile);
      });
    } else {
      for (var i = 0; i < 3; i++) {
        var tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerHTML = galleryIconSVG() + '<span>Image supplémentaire ' + (i + 1) + '</span>';
        projectGallery.appendChild(tile);
      }
    }

    var idx = projects.findIndex(function(x) { return x.id === p.id; });
    var next = projects[(idx + 1) % projects.length];
    projectNav.innerHTML =
      '<a href="#/projet/' + next.id + '" data-nav="' + next.id + '">Projet suivant : ' + next.title + ' →</a>';
    projectNav.querySelector('a').addEventListener('click', function(e) {
      e.preventDefault();
      navigateTo(next.id);
    });

    document.title = p.title + ' — Marcus Vigneron';
  }

  function showProjectView(id) {
    var p = projects.find(function(x) { return x.id === id; });
    if (!p) { showHomeView(); return; }
    closeLightbox();
    homeView.classList.add('hidden');
    projectView.classList.add('visible');
    renderProject(p);
    window.scrollTo(0, 0);
  }

  function showHomeView() {
    closeLightbox();
    projectView.classList.remove('visible');
    homeView.classList.remove('hidden');
    document.title = 'Marcus Vigneron — Concept art & 3D';
  }

  function navigateTo(id) {
    history.pushState({ id: id }, '', '#/projet/' + id);
    showProjectView(id);
  }

  backBtn.addEventListener('click', function() {
    history.pushState({}, '', location.pathname + location.search);
    showHomeView();
  });

  window.addEventListener('popstate', function() {
    var m = location.hash.match(/^#\/projet\/(.+)$/);
    if (m) { showProjectView(m[1]); } else { showHomeView(); }
  });

  // route au chargement
  (function initRoute() {
    var m = location.hash.match(/^#\/projet\/(.+)$/);
    if (m && projects.some(function(p) { return p.id === m[1]; })) {
      showProjectView(m[1]);
    } else {
      requestAnimationFrame(function() {
        cards[0].scrollIntoView({ behavior: 'auto', block: 'center' });
        setActive(0);
      });
    }
  })();

  // Si la fenêtre change de taille (largeur ou hauteur), on recalcule
  // l'espacement du carrousel et on recentre la carte active, pour que
  // rien ne se retrouve mal positionné après le redimensionnement.
  var resizeTimer = null;
  window.addEventListener('resize', function() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      updateCarouselPadding();
      if (activeIndex >= 0 && cards[activeIndex]) {
        cards[activeIndex].scrollIntoView({ behavior: 'auto', block: 'center' });
      }
    }, 120);
  });

})();
</script>
